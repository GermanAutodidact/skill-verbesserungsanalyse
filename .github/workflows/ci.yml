name: Skill Audit & Self-Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run add_toc.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/add_toc.py --self-test

      - name: Run skill_audit.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/skill_audit.py --self-test

      - name: Run strict skill audit (--fail-on p2)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/skill_audit.py . --fail-on p2
