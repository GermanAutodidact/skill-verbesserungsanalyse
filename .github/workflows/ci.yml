name: Skill Audit & Self-Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run add_toc.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/add_toc.py --self-test

      - name: Run audit_security.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/audit_security.py --self-test

      - name: Run audit_quality.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/audit_quality.py --self-test

      - name: Run audit_sarif.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/audit_sarif.py --self-test

      - name: Run skill_audit.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/skill_audit.py --self-test

      - name: Run strict skill audit (--fail-on p2)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/skill_audit.py . --fail-on p2

      - name: Validate SARIF 2.1.0 export
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/skill_audit.py . --sarif > /tmp/audit.sarif
          python3 -c 'import json; d=json.load(open("/tmp/audit.sarif")); assert d["version"]=="2.1.0" and len(d["runs"][0]["tool"]["driver"]["rules"])>=26 and len(d["runs"][0]["results"])==0, d["runs"][0]["results"]; print("OK: SARIF 2.1.0 valid, 0 findings.")'
