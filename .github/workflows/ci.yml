name: Skill Audit & Self-Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run add_toc.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/add_toc.py --self-test

      - name: Run audit_security.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/audit_security.py --self-test

      - name: Run audit_quality.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/audit_quality.py --self-test

      - name: Run audit_sarif.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/audit_sarif.py --self-test

      - name: Run skill_audit.py self-test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/skill_audit.py --self-test

      - name: Run strict skill audit (--fail-on p3 incl. SSOT version & rule consistency)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/skill_audit.py . --fail-on p3

      - name: Validate SARIF 2.1.0 export
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/skill_audit.py . --sarif > /tmp/audit.sarif
          python3 -c 'import json, sys; sys.path.insert(0, "scripts"); import audit_sarif; d=json.load(open("/tmp/audit.sarif")); r=d["runs"][0]; assert d["version"]=="2.1.0" and r["tool"]["driver"]["version"]==audit_sarif.TOOL_VERSION and len(r["tool"]["driver"]["rules"])==audit_sarif.RULE_COUNT and len(r["results"])==0, r["results"]; print(f"OK: SARIF 2.1.0 valid, version={audit_sarif.TOOL_VERSION}, rules={audit_sarif.RULE_COUNT}, 0 findings.")'
